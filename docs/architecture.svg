<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1180" height="460" fill="#ffffff"/>

  <!-- Данные -->
  <rect x="20" y="150" width="170" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="105" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Стартовый датасет</text>
  <text x="105" y="200" text-anchor="middle" font-size="11" fill="#475569">employees.json</text>
  <text x="105" y="218" text-anchor="middle" font-size="11" fill="#475569">events.json</text>
  <text x="105" y="236" text-anchor="middle" font-size="11" fill="#475569">skills.json</text>
  <text x="105" y="254" text-anchor="middle" font-size="11" fill="#475569">activity_history.csv</text>
  <text x="105" y="276" text-anchor="middle" font-size="10" fill="#94a3b8">200 / 40 / 60 / 2743</text>

  <!-- Жюри upload -->
  <rect x="20" y="20" width="170" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="105" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Жюри на защите</text>
  <text x="105" y="63" text-anchor="middle" font-size="11" fill="#92400e">upload проверочных</text>
  <text x="105" y="78" text-anchor="middle" font-size="11" fill="#92400e">профилей (тот же формат)</text>
  <line x1="105" y1="90" x2="105" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- store.py -->
  <rect x="240" y="150" width="180" height="140" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="330" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">store.py</text>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#1e40af">DataStore</text>
  <text x="330" y="222" text-anchor="middle" font-size="10" fill="#475569">в памяти процесса</text>
  <text x="330" y="240" text-anchor="middle" font-size="10" fill="#475569">+ add_employees()</text>
  <text x="330" y="256" text-anchor="middle" font-size="10" fill="#475569">+ add_history()</text>
  <text x="330" y="272" text-anchor="middle" font-size="10" fill="#475569">+ complete_activity()</text>
  <line x1="190" y1="220" x2="240" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- engine.py -->
  <rect x="480" y="130" width="200" height="180" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="580" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">engine.py</text>
  <text x="580" y="178" text-anchor="middle" font-size="11" fill="#166534">recommend() · hr_overview()</text>
  <text x="580" y="200" text-anchor="middle" font-size="10" fill="#475569">детерминированно:</text>
  <text x="580" y="218" text-anchor="middle" font-size="10" fill="#475569">разрыв × вес критичности</text>
  <text x="580" y="234" text-anchor="middle" font-size="10" fill="#475569">+ история отказов/пропусков</text>
  <text x="580" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">→ устойчиво к «однофакторной</text>
  <text x="580" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">ловушке» жюри</text>
  <text x="580" y="294" text-anchor="middle" font-size="10" fill="#94a3b8">Регрессионные тесты и профили жюри</text>
  <line x1="420" y1="220" x2="480" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- explain.py -->
  <rect x="740" y="130" width="210" height="180" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="845" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">explain.py</text>
  <text x="845" y="180" text-anchor="middle" font-size="11" fill="#991b1b">build_rationale_async()</text>
  <text x="845" y="202" text-anchor="middle" font-size="10" fill="#475569">1. шаблон (всегда, kk/ru/en)</text>
  <text x="845" y="220" text-anchor="middle" font-size="10" fill="#475569">2. LLM agentic — опционально:</text>
  <text x="845" y="236" text-anchor="middle" font-size="10" fill="#475569">function calling,</text>
  <text x="845" y="252" text-anchor="middle" font-size="10" fill="#475569">по кнопке, бюджет 8с/объяснение</text>
  <text x="845" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">→ факты всегда из engine.py,</text>
  <text x="845" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">текст ИИ проверяется по фактам</text>
  <line x1="680" y1="220" x2="740" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OpenAI optional -->
  <rect x="770" y="20" width="150" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="845" y="45" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">OpenAI API</text>
  <text x="845" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">опционально</text>
  <line x1="845" y1="80" x2="845" y2="130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>

  <!-- main.py -->
  <rect x="1000" y="150" width="160" height="140" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="1080" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">main.py</text>
  <text x="1080" y="198" text-anchor="middle" font-size="11" fill="#6b21a8">FastAPI</text>
  <text x="1080" y="222" text-anchor="middle" font-size="10" fill="#475569">HTML-страницы</text>
  <text x="1080" y="238" text-anchor="middle" font-size="10" fill="#475569">(Jinja2 + Tailwind)</text>
  <text x="1080" y="256" text-anchor="middle" font-size="10" fill="#475569">JSON API, роли, CSRF</text>
  <text x="1080" y="272" text-anchor="middle" font-size="10" fill="#475569">i18n: kk/ru/en</text>
  <line x1="950" y1="220" x2="1000" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Пользователи -->
  <rect x="480" y="370" width="200" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="395" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Сотрудник</text>
  <text x="580" y="413" text-anchor="middle" font-size="10" fill="#475569">/employee/{id} — только свой профиль</text>
  <line x1="1080" y1="290" x2="1080" y2="405" stroke="#475569" stroke-width="1.5"/>
  <line x1="1080" y1="405" x2="680" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="740" y="370" width="200" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="840" y="395" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">HR</text>
  <text x="840" y="413" text-anchor="middle" font-size="10" fill="#475569">/hr — агрегаты, без приватных данных</text>
  <line x1="1030" y1="310" x2="900" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
