<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Career Quest{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  <link rel="stylesheet" href="/static/tailwind.css">
  <script src="/static/app.js" defer></script>
  <style>
    :root { color-scheme: light; }
    body { background: #f5f7f5; }
    .page-shell { max-width: 1120px; margin: 0 auto; }
    .surface { background: #fff; border: 1px solid #dfe8e1; border-radius: 20px; box-shadow: 0 10px 30px rgba(18, 49, 37, .035); }
    .hero-surface { background: radial-gradient(circle at 90% 0, #d9f1df 0, transparent 32%), linear-gradient(135deg, #f0faf2, #fff 62%); border: 1px solid #cfe5d4; border-radius: 24px; }
    .eyebrow { color: #237347; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .action-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .65rem 1rem; border-radius: 12px; background: #11663e; color: #fff; font-weight: 700; line-height: 1.2; transition: background-color .2s, transform .2s; }
    .action-button:hover { background: #0d4f31; transform: translateY(-1px); }
    .secondary-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .65rem 1rem; border: 1px solid #b9d8c3; border-radius: 12px; background: #fff; color: #11663e; font-weight: 700; line-height: 1.2; transition: background-color .2s; }
    .secondary-button:hover { background: #f0faf2; }
    button:disabled { opacity: .65; cursor: wait; }
    .action-button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid #f2b544; outline-offset: 3px; }
    .secondary-button:focus-visible { outline: 3px solid #f2b544; outline-offset: 3px; }
    .soft-link { color: #11663e; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    .metric-number { color: #153c2a; font-size: clamp(1.7rem, 3vw, 2.5rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
    .reveal { animation: rise-in .35s ease-out both; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } .action-button, .secondary-button { transition: none; } .action-button:hover { transform: none; } }
  </style>
</head>
<body class="text-slate-900 min-h-screen antialiased">
  <nav class="bg-white/95 border-b border-emerald-100 px-4 sm:px-6 py-3">
    <div class="page-shell flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
    <a href="/" class="font-extrabold text-lg tracking-tight whitespace-nowrap text-emerald-950">🧭 {{ t('brand') }}</a>
    <div class="order-2 w-full flex flex-wrap items-center gap-x-4 gap-y-2 sm:order-none sm:w-auto">
      {% if user_role == 'hr' %}<a href="/hr" class="text-sm text-slate-600 hover:text-emerald-800">{{ t('nav_hr') }}</a>{% endif %}
      <a href="/" class="text-sm text-slate-600 hover:text-emerald-800">{{ t('nav_switch_employee') }}</a>
      {% if user_role %}<form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="text-sm text-slate-600 hover:text-emerald-800">{{ t('logout') }}</button></form>{% endif %}
    </div>
    <div class="order-1 flex items-center gap-1 text-xs sm:order-none" aria-label="{{ t('language_label') }}">
        {% for code in ['ru', 'kk', 'en'] %}
        <a href="{{ request.url.include_query_params(lang=code) }}"
           class="px-2 py-1 rounded-md {{ 'bg-emerald-800 text-white' if lang == code else 'text-slate-500 hover:text-emerald-800' }}" {% if lang == code %}aria-current="page"{% endif %}>{{ code|upper }}</a>
        {% endfor %}
    </div>
    </div>
  </nav>
  <main class="page-shell px-4 sm:px-6 py-7 sm:py-10">
    <p class="text-xs text-slate-500 mb-5">{{ t('demo_notice', date=as_of_date) }}</p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
